[workspace]
resolver = "3"
members  = [ "crates/midnight-did", "crates/midnight-did-api", "crates/midnight-did-cli", "crates/midnight-did-domain", "crates/midnight-did-indexer", "crates/midnight-did-jubjub-schnorr", "crates/midnight-did-method", "crates/midnight-did-resolver", "crates/midnight-did-runtime", "crates/midnight-did-uniffi", "crates/midnight-passport-account-source", "crates/midnight-passport-account", "crates/midnight-passport-vault-source", "crates/midnight-vc-domain", "crates/midnight-vc-families", "crates/midnight-vc-proof", "crates/midnight-vc-runtime" ]
exclude  = [ "third_party/midnight-ledger" ]

[workspace.package]
version      = "0.5.0"
edition      = "2024"
rust-version = "1.99"
license      = "Apache-2.0"
authors      = [ "Midnight Foundation" ]
repository   = "https://github.com/MediaNoxLabs/midnight-identity"

[workspace.dependencies]
# Generic, chain-neutral cryptographic primitives. Keep the canary registry
# version exact and its feature cone minimal; Midnight-specific semantics remain
# in this workspace (ADR 0011).
identus-crypto = { version = "=0.1.0-rc.1", default-features = false, features = [ "hash" ] }
# Keep the shared names on the Ledger 8 cone because VC and Passport are out
# of scope for this migration. The DID runtime declares its exact Ledger 9
# cohort locally so the two product surfaces cannot be silently conflated.
midnight-base-crypto      = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "8655615e7c4cbf3a1187b3203bf72e69dc09b8dc" }
midnight-coin-structure   = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "8655615e7c4cbf3a1187b3203bf72e69dc09b8dc" }
midnight-onchain-runtime  = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "8655615e7c4cbf3a1187b3203bf72e69dc09b8dc" }
midnight-onchain-state    = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "8655615e7c4cbf3a1187b3203bf72e69dc09b8dc" }
midnight-onchain-vm       = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "8655615e7c4cbf3a1187b3203bf72e69dc09b8dc" }
midnight-serialize        = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "8655615e7c4cbf3a1187b3203bf72e69dc09b8dc" }
midnight-storage          = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "8655615e7c4cbf3a1187b3203bf72e69dc09b8dc" }
midnight-transient-crypto = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "8655615e7c4cbf3a1187b3203bf72e69dc09b8dc" }
midnight-zkir             = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "8655615e7c4cbf3a1187b3203bf72e69dc09b8dc" }
midnight-zswap            = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "8655615e7c4cbf3a1187b3203bf72e69dc09b8dc" }
midnight-ledger           = { git = "https://github.com/MediaNoxLabs/midnight-ledger.git", rev = "8655615e7c4cbf3a1187b3203bf72e69dc09b8dc" }
compact-runtime           = { package = "midnight-compact-runtime", git = "https://github.com/MediaNoxLabs/compact.git", rev = "32e314770da10cc62dab30dcfeb340ec4c6bcb64" }
# VC and Passport generated sources import this dependency name directly, so it
# remains on their existing runtime revision. DID pins Runtime 0.2.0 locally.
midnight-compact-runtime = { package = "midnight-compact-runtime", git = "https://github.com/MediaNoxLabs/compact.git", rev = "32e314770da10cc62dab30dcfeb340ec4c6bcb64" }
# common
serde      = { version = "1", features = [ "derive" ] }
serde_json = "1"
hex        = "0.4"
# domain crate (pure-data Midnight DID types)
# `version = "=0.5.0"` is required for `cargo publish` to accept midnight-did-api's
# manifest — crates.io rejects path-only dependencies. The `=` pin keeps the two
# crates lock-stepped: bumping midnight-did-api to 0.1.1 must also bump
# midnight-did-domain to 0.1.1. Same pattern as midnight-compact-runtime + midnight-compact-runtime-macros
# in the codegen-rust toolchain.
midnight-did-domain = { path = "crates/midnight-did-domain", version = "=0.5.0" }
# method crate — Midnight method profile + LedgerToDomain mapper + network mapping.
midnight-did-method = { path = "crates/midnight-did-method", version = "=0.5.0" }
# api crate — consumed by the reference CLI + (future) downstream tooling
midnight-did-api = { path = "crates/midnight-did-api", version = "=0.5.0" }
# runtime crate — codegen target (currently blocked on upstream halo2 skew).
midnight-did-runtime        = { path = "crates/midnight-did-runtime", version = "=0.5.0" }
midnight-did-indexer        = { path = "crates/midnight-did-indexer" }
midnight-did-jubjub-schnorr = { path = "crates/midnight-did-jubjub-schnorr", version = "=0.5.0" }
# umbrella crate — re-exports the full 4-crate stack for monolithic consumers.
midnight-did = { path = "crates/midnight-did", version = "=0.5.0" }
# VC layer (issue #13). `vc-domain` is pure data and publishable on its own
# cadence (hence the `=` version pin, same rationale as midnight-did-domain);
# `vc-runtime` is the codegen target and stays unpublished.
midnight-vc-domain               = { path = "crates/midnight-vc-domain", version = "=0.5.0" }
midnight-vc-families             = { path = "crates/midnight-vc-families" }
midnight-vc-proof                = { path = "crates/midnight-vc-proof" }
midnight-vc-runtime              = { path = "crates/midnight-vc-runtime" }
midnight-passport-account-source = { path = "crates/midnight-passport-account-source", version = "=0.5.0" }
midnight-passport-account        = { path = "crates/midnight-passport-account", version = "=0.5.0" }
midnight-passport-vault-source   = { path = "crates/midnight-passport-vault-source", version = "=0.5.0" }

# The Ledger 8 transient-crypto package relies on this source-compatible
# proofs fork. Ledger 9 resolves its released 0.8.x proof cohort separately.
[patch.crates-io]
midnight-proofs = { git = "https://github.com/MediaNoxLabs/midnight-zk.git", rev = "532629b044a88473a7175f4a96c2511c91156136" }

[profile.dev]
debug = "limited"

[profile.release]
lto           = "thin"
codegen-units = 1
