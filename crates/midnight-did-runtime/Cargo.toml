[package]
name                   = "midnight-did-runtime"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
description            = "Codegen target for the Midnight DID Method — generated.rs, witnesses, controller key. Renamed from `midnight-did` (now an umbrella crate) per ADR 0003."

[lib]
name = "midnight_did_runtime"
path = "src/lib.rs"

[features]
default            = [  ]
http               = [ "dep:reqwest" ]
ledger-transaction = [ "midnight-compact-runtime/ledger-transaction" ]
node-subxt         = [ "dep:futures", "dep:subxt", "dep:tokio" ]

[dependencies]
# The immutable Compact runtime revision is declared at the workspace root.
# Its sibling macro crate resolves from the same Git checkout. Nix path
# substitution is available only through the explicit local override wrapper.
midnight-compact-runtime = { package = "midnight-compact-runtime", git = "https://github.com/betsudo/compact", rev = "05c9ed69b891baa4f15777403c9bdc8bc86c150c", features = [ "experimental-functional" ] }

# Exact Ledger 9.1.0.2 source graph needed by generated.rs and the native
# backend. Shared workspace names remain on the retained VC/Passport graph;
# every DID dependency uses the same immutable Ledger revision as Compact.
midnight-base-crypto      = { version = "=1.1.1", git = "https://github.com/betsudo/midnight-ledger", rev = "f82ac287442fc15c4eb79f02dcb6510373979eab" }
midnight-coin-structure   = { version = "=3.0.1", git = "https://github.com/betsudo/midnight-ledger", rev = "f82ac287442fc15c4eb79f02dcb6510373979eab" }
midnight-onchain-runtime  = { version = "=4.0.1", git = "https://github.com/betsudo/midnight-ledger", rev = "f82ac287442fc15c4eb79f02dcb6510373979eab" }
midnight-serialize        = { version = "=1.2.1", git = "https://github.com/betsudo/midnight-ledger", rev = "f82ac287442fc15c4eb79f02dcb6510373979eab" }
midnight-ledger           = { package = "midnight-ledger-v9", version = "=1.0.2", git = "https://github.com/betsudo/midnight-ledger", rev = "f82ac287442fc15c4eb79f02dcb6510373979eab" }
midnight-storage          = { version = "=3.1.0", git = "https://github.com/betsudo/midnight-ledger", rev = "f82ac287442fc15c4eb79f02dcb6510373979eab" }
midnight-transient-crypto = { version = "=3.1.0", git = "https://github.com/betsudo/midnight-ledger", rev = "f82ac287442fc15c4eb79f02dcb6510373979eab" }
# Sibling first-party crates — R2-2 (v0.4.0) lifts ledger-shape types
# (`DidLedgerSnapshot`, `LedgerVerificationMethod`, `MapMutation`, …) into
# this crate so `DidContractCall` can carry them as variant payloads. The
# api crate now re-exports these for downstream consumers.
midnight-did-domain = { workspace = true }
midnight-did-method = { workspace = true }

# R2-1: async-trait for the I/O-substrate `Backend` trait. Pinned to
# 0.1 to match the version already used by `midnight-did-api`.
async-trait = "0.1"

# R2-2 (v0.4.0): `DidContractCall` is serialised into `BuiltTx::bytes`
# via serde_json so the recording backend can decode the typed envelope.
# blake2 is used by the recording backend to synthesise a deterministic
# `FinalizedTxData::tx_hash` from the envelope bytes.
serde      = { workspace = true }
serde_json = { workspace = true }
hex        = { workspace = true }
blake2     = "0.10"

# R2-3 (architecture-audit Rec #1): validating constructors on
# `JubjubPointHex`, `SchnorrJubjubSignature`, and `SchnorrJubjubDigest`
# return a typed `ValidationError`.
thiserror = "2"
rand      = "0.8"
sha2      = "0.10"
zeroize   = "1.9"
futures   = { version = "0.3", optional = true }
subxt     = { version = "0.44", optional = true }
tokio     = { version = "1", features = [ "time" ], optional = true }
reqwest   = { version = "0.13", default-features = false, features = [ "json", "rustls" ], optional = true }

[dev-dependencies]
midnight-zkir = { version = "=3.2.1" }
# R2-1: tokio runtime for the `Backend` impls' unit tests (current-thread,
# no IO).
tokio = { version = "1", features = [ "macros", "rt" ] }
