[package]
name                   = "midnight-vc-families"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true
description            = "Codegen target for Midnight Verifiable Credentials credential families — Rust bindings emitted from the family prototype contracts (digital-passport today)."

# `publish = false` per doc/publishing.md: like `midnight-vc-runtime`, this
# crate depends on immutable Git revisions of the unpublished Compact runtime
# and Ledger stack. Publishing stays blocked until those upstream crates publish;
# consumers use a Git dependency on this repository.
publish = false

[lib]
name = "midnight_vc_families"
path = "src/lib.rs"

[features]
# One feature per credential family, `default = []`: the family surfaces are
# prototype-grade and churn upstream, so every consumer opts in explicitly
# (design D2). Features are strictly additive — enabling a family never
# changes another enabled family's surface.
default = [  ]

# The digital-passport family binding (types + `pure_circuits`) under
# `contract::digital_passport`.
digital-passport = [  ]

[dependencies]
# The published Passport source is still Ledger 8, but its pure Compact family
# compiles unchanged when staged with VC Core 1.0.0-rc1. The generated Rust must
# therefore use the exact Ledger 9 cohort selected by that core.
midnight-compact-runtime = { package = "midnight-compact-runtime", git = "https://github.com/betsudo/compact", rev = "d6513a24debac14d43a8199460d9dc2c6d9af2b1", features = [ "experimental-functional" ] }
midnight-base-crypto     = { version = "=1.1.1", git = "https://github.com/betsudo/midnight-ledger", rev = "6fbc2e3900845a858f70eebf8a0deab1d4d3c0d6" }
midnight-onchain-runtime = { version = "=4.0.1", git = "https://github.com/betsudo/midnight-ledger", rev = "6fbc2e3900845a858f70eebf8a0deab1d4d3c0d6" }
midnight-serialize       = { version = "=1.2.1", git = "https://github.com/betsudo/midnight-ledger", rev = "6fbc2e3900845a858f70eebf8a0deab1d4d3c0d6" }

[dev-dependencies]
# SHA-256 for the deterministic test fixtures ported from the family
# package's `src/testing/credential-fixtures.ts` (openings are
# sha256("opening:<field>") there).
sha2 = "0.10"
# Decode the TS-captured golden vectors in `tests/fixtures/ts-parity.json`.
hex        = { workspace = true }
serde_json = { workspace = true }
